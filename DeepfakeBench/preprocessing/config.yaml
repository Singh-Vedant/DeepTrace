preprocess:
  dataset_name:
    choices:
    - FaceForensics++
    - Celeb-DF-v1
    - Celeb-DF-v2
    - DFDCP
    - DFDC
    - DeeperForensics-1.0
    - UADFV
    default: UADFV
  dataset_root_path:
    type: str
    default: ../datasets/UADFV
  comp:
    choices:
    - raw
    - c23
    - c40
    default: c23
  mode:
    choices:
    - fixed_num_frames
    - fixed_stride
    default: fixed_num_frames
  stride:
    type: int
    default: 10
  num_frames:
    type: int
    default: 32
rearrange:
  dataset_name:
    choices:
    - FaceForensics++
    - DeepFakeDetection
    - Celeb-DF-v1
    - Celeb-DF-v2
    - DFDCP
    - DFDC
    - DeeperForensics-1.0
    - UADFV
    - FaceShifter
    default: UADFV
    dataset_root_path:
      type: str
      default: ../datasets/UADFV
    output_file_path:
      type: str
      default: ../preprocessing/dataset_json_v6
  comp:
    choices:
    - raw
    - c23
    - c40
    default: c23
  perturbation:
    choices:
    - end_to_end
    - end_to_end_level_1
    - end_to_end_level_2
    - end_to_end_level_3
    - end_to_end_level_4
    - end_to_end_level_5
    - end_to_end_mix_2_distortions
    - end_to_end_mix_3_distortions
    - end_to_end_mix_4_distortions
    - end_to_end_random_level
    - reenact_postprocess
    default: end_to_end
  dataset_root_path:
    type: str
    default: ../datasets/UADFV/UADFV
  output_file_path:
    type: str
    default: ../preprocessing/dataset_json_v6
to_lmdb:
  dataset_name:
    choices:
    - FaceForensics++
    - DeepFakeDetection
    - Celeb-DF-v1
    - Celeb-DF-v2
    - DFDCP
    - DFDC
    - DeeperForensics-1.0
    - UADFV
    - FaceShifter
    default: FaceForensics++
  dataset_root_path:
    type: str
    default: ./datasets_v2
  output_lmdb_dir:
    type: str
    default: ./datasets_lmdbs
  comp:
    choices:
    - raw
    - c23
    - c40
    default: c23
